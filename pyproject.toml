[project]
name = "core-btr"
version = "0.1.0"
description = "Deterministic multi-lens Set Transformer retrieval pod for sequential tabular & ARTIQ HDF5 telemetry"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "h5py>=3.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "fastmcp>=0.4",
    "pydantic>=2.6",
]

[project.optional-dependencies]
bench = ["sentence-transformers>=3.0"]
